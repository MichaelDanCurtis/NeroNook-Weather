<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org https://tilecache.rainviewer.com https://nowcoast.noaa.gov; connect-src 'none'"><link rel="stylesheet" href="leaflet.css"><style>html,body{margin:0;height:100%;font:13px -apple-system,sans-serif;background:#142536;color:#e8f2f9}#map{height:100%;background:#142536}.bar{position:absolute;z-index:1000;top:12px;left:55px;right:12px;background:#0c1729ed;border-radius:10px;padding:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select{background:#263e50;color:white;border:1px solid #496279;border-radius:6px;padding:6px}#stamp{font-size:12px;color:#b8d2dd}#error{position:absolute;z-index:1000;bottom:30px;left:12px;color:#ffdb9e;background:#172435;padding:6px;display:none}.leaflet-control-attribution{font-size:10px}</style></head><body><div id="map"></div><div class="bar"><select id="layer" aria-label="Weather layer"><option value="none">Street map</option><option value="radar">Rain radar</option><option value="satellite">Infrared clouds</option><option value="cyclones">Tropical cyclones</option></select><button id="center">Recenter</button><input type="range" id="frame" min="0" max="0" value="0" aria-label="Observation time" hidden><span id="stamp">Choose an observed layer</span></div><div id="error"></div><script src="leaflet.js"></script><script>
const map=L.map('map').setView([20,-155],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);let state={},key='',overlay=null,marker=null,frames=[];
const selector=document.querySelector('#layer'),slider=document.querySelector('#frame'),stamp=document.querySelector('#stamp'),error=document.querySelector('#error');
window.setWeather=function(data){state=data;const next=data.lat+','+data.lon;if(next!==key){key=next;map.setView([data.lat,data.lon],7);if(marker)map.removeLayer(marker);marker=L.circleMarker([data.lat,data.lon],{radius:6,color:'#f5c668',fillOpacity:1}).addTo(map);marker.bindTooltip(document.createTextNode(data.name))}render(true)};
function message(text){error.textContent=text;error.style.display=text?'block':'none'}
function render(reset){if(overlay){map.removeLayer(overlay);overlay=null}message('');const layer=selector.value;slider.hidden=!['radar','satellite'].includes(layer);if(layer==='none'){stamp.textContent='Street map · reference map';return}if(layer==='radar'){frames=(state.radar?.radar?.past||[]).filter(f=>Number.isFinite(f.time)&&/^\/v2\/radar\/[a-zA-Z0-9_-]+$/.test(f.path));if(!frames.length){stamp.textContent='Radar observations unavailable';return}slider.max=frames.length-1;if(reset)slider.value=slider.max;const frame=frames[Number(slider.value)];stamp.textContent='Loading radar observation…';overlay=L.tileLayer('https://tilecache.rainviewer.com'+frame.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:.7,maxNativeZoom:7,maxZoom:19,attribution:'<a href="https://www.rainviewer.com/">RainViewer</a>'});overlay.on('load',()=>{stamp.textContent='Radar · '+new Date(frame.time*1000).toLocaleString()});overlay.on('tileerror',()=>message('Some radar tiles failed; coverage may be incomplete.'));overlay.addTo(map);return}
if(layer==='satellite'){frames=(state.satellite?.times||[]).filter(t=>typeof t==='string'&&Number.isFinite(Date.parse(t)));if(!frames.length&&state.satellite?.time)frames=[state.satellite.time];if(!frames.length){stamp.textContent='Satellite observations unavailable';return}slider.max=frames.length-1;if(reset)slider.value=slider.max;const time=frames[Number(slider.value)];stamp.textContent='Loading infrared observation…';overlay=L.tileLayer.wms('https://nowcoast.noaa.gov/geoserver/observations/satellite/wms',{layers:'global_longwave_imagery_mosaic',format:'image/png',transparent:true,time,opacity:.65,attribution:'NOAA nowCOAST'});overlay.on('load',()=>stamp.textContent='Infrared · '+new Date(time).toLocaleString());overlay.on('tileerror',()=>message('Satellite imagery unavailable in this view.'));overlay.addTo(map);return}
const storms=state.cyclones?.storms;if(!Array.isArray(storms)){stamp.textContent='Cyclone feed unavailable';return}overlay=L.layerGroup();for(const storm of storms){if(!Number.isFinite(storm.lat)||!Number.isFinite(storm.lon))continue;const text=document.createElement('div');text.textContent=storm.name+' · '+storm.classification+' · '+storm.updated;L.circleMarker([storm.lat,storm.lon],{radius:9,color:'#ff9c5d'}).bindPopup(text).addTo(overlay)}overlay.addTo(map);stamp.textContent='NOAA NHC/CPHC · '+storms.length+' active storms';}
selector.onchange=()=>render(true);slider.oninput=()=>render(false);document.querySelector('#center').onclick=()=>{if(Number.isFinite(state.lat))map.setView([state.lat,state.lon],7)};
</script></body></html>
